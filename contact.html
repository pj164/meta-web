<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Meta Limits</title>
  <meta name="description" content="Get in touch with Meta Limits. We'd love to hear about your business and how we can help with bookkeeping." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

<nav>
  <a href="/" class="nav-logo">meta<span>limits</span></a>
  <ul class="nav-links">
    <li><a href="/#services">Services</a></li>
    <li><a href="/#why">Why Us</a></li>
    <li><a href="/contact.html" class="nav-cta">Get in Touch</a></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="section-label">Let's talk</div>
  <h1 style="font-size: clamp(32px, 5vw, 52px); letter-spacing: -1px; margin-bottom: 16px;">Get in touch</h1>
  <p style="color: var(--muted); font-size: 17px; max-width: 440px; margin: 0 auto;">
    Tell us about your business and we'll get back to you within one business day.
  </p>
</div>

<div class="contact-wrap">
  <form class="contact-form" action="https://formspree.io/f/hello@metalimits.com" method="POST">
    <div class="form-group">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="Jane Smith" required />
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="jane@company.com" required />
    </div>

    <div class="form-group">
      <label for="company">Company (optional)</label>
      <input type="text" id="company" name="company" placeholder="Acme Inc." />
    </div>

    <div class="form-group">
      <label for="service">What are you looking for?</label>
      <select id="service" name="service">
        <option value="">— Select a service —</option>
        <option value="bookkeeping">Bookkeeping</option>
        <option value="reporting">Financial Reporting</option>
        <option value="tax">Tax Preparation</option>
        <option value="cfo">CFO Advisory</option>
        <option value="other">Not sure yet</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us a bit about your business and what you need..." required></textarea>
    </div>

    <button type="submit" class="form-submit">Send message</button>
  </form>

  <p class="contact-note">
    Or email us directly at <a href="mailto:hello@metalimits.com">hello@metalimits.com</a>
  </p>
</div>

<footer>
  <p>&copy; 2025 Meta Limits &nbsp;·&nbsp; <a href="mailto:hello@metalimits.com">hello@metalimits.com</a></p>
</footer>

</body>
</html>
